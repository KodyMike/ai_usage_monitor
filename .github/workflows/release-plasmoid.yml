name: Build and Attach Plasmoid

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp manifest version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'EOF'
          import json, sys
          path = 'com.aiusagemonitor/metadata.json'
          with open(path) as f:
              manifest = json.load(f)
          manifest['KPlugin']['Version'] = sys.argv[1]
          with open(path, 'w') as f:
              json.dump(manifest, f, indent=4)
              f.write('\n')
          EOF
          grep -F '"Version"' com.aiusagemonitor/metadata.json

      - name: Build plasmoid package
        run: |
          cd com.aiusagemonitor
          zip -r ../ai-usage-monitor.plasmoid . -x "*/__pycache__/*" "*.pyc" "./install.sh" "./upgrade.sh"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ai-usage-monitor.plasmoid
